name: Update market data

on:
  # Schedule disabled for now: Yahoo hard-blocks GitHub-hosted (Azure) runner
  # IPs — every fetch returns empty even with yfinance[nospam]. Re-enable once
  # the fetch runs somewhere Yahoo allows (self-hosted runner or an API key
  # based source such as Tiingo).
  # schedule:
  #   - cron: "30 22 * * 1-5"  # weekdays after the US close (EST and EDT)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-data
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install --quiet "yfinance[nospam]" pandas

      - name: Fetch missing bars
        id: fetch
        continue-on-error: true
        run: python scripts/update_market_data.py

      - name: Commit and push updates
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "no data changes"
          else
            git commit -m "data: update market data ($(date -u +%F))"
            git pull --rebase origin main
            git push
          fi

      - name: Fail if any ticker failed
        if: steps.fetch.outcome == 'failure'
        run: exit 1
