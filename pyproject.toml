[project]
name = "dongpa-backtest"
version = "0.1.0"
description = "Backtester and LOC order book for the Dongpa (동파법) strategy, served as a React + FastAPI web app"
requires-python = ">=3.13"
dependencies = [
    "fastapi",
    "yfinance",
    "pandas",
    "numpy",
    "scipy", # yfinance download(repair=True) needs it; without it every fetch comes back empty
    "uvicorn",
    "exchange-calendars>=4.13.2",
    "requests>=2.32.5",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov>=7.0.0",
]

# Strategy research under benchmarks/ (Optuna searches)
bench = [
    "optuna",
]
